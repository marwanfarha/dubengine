# Every push and pull request: host tests and simulator scenarios, plus the browser emulator
# as a downloadable artifact. No hardware and no JieLi toolchain needed.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DUB 1's v1.0.0 tag (the recipe prints check reads amb.c's history from it)
        run: git fetch --no-tags https://github.com/sbegueria/fm1-dub 'refs/tags/v1.0.0:refs/tags/v1.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Libraries for the screen font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0
      - run: pip install pillow
      - name: Host tests and scenarios
        run: sh tests/run_tests.sh
      - name: Keep the scenario screenshots and audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios
          path: build/scenarios
          if-no-files-found: ignore

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Libraries for the screen font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0
      - run: pip install pillow
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build the browser emulator
        run: sh web/emu/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: emulator
          path: build/emu

  # The real firmware, built for the FM1 with JieLi's toolchain, then every test again with the package there: the
  # update path (the loader, the package's entry, an older package updated to this one) and the web installer. The
  # build itself checks the image, RAM and pool sizes. The .fwsc is kept as a download, for testing on a unit.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DUB 1's v1.0.0 tag (the recipe prints check)
        run: git fetch --no-tags https://github.com/sbegueria/fm1-dub 'refs/tags/v1.0.0:refs/tags/v1.0.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0 xz-utils
      - run: pip install pillow mido
      - name: JieLi toolchain
        run: sh tools/get_toolchain.sh
      - name: JieLi AC79 SDK
        run: git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK
      - name: Build the firmware
        run: ./build.sh
      - name: Every test, the update path included
        run: AC79_SDK=$HOME/fw-AC79_AIoT_SDK sh tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware
          path: build/*.fwsc
          if-no-files-found: ignore

