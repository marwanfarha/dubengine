# Every push and pull request: host tests and simulator scenarios, plus the browser emulator
# as a downloadable artifact. No hardware and no JieLi toolchain needed.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Libraries for the screen font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0
      - run: pip install pillow
      - name: Host tests and scenarios
        run: sh tests/run_tests.sh
      - name: Keep the scenario screenshots and audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios
          path: build/scenarios
          if-no-files-found: ignore

  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Libraries for the screen font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 libraqm0
      - run: pip install pillow
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build the browser emulator
        run: sh web/emu/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: emulator
          path: build/emu
